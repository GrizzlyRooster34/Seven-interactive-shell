<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seven Interactive Shell</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #030712;
        --color-seven: #22d3ee; /* Cyan-400 */
        --color-system: #4ade80; /* Green-400 */
        --color-alert: #ef4444; /* Red-500 */
        --color-warn: #facc15; /* Yellow-400 */
      }
      body {
        margin: 0;
        background-color: var(--color-bg);
        color: var(--color-seven);
        font-family: 'Fira Code', monospace;
        overflow: hidden;
      }
      
      /* CRT Scanline Effect */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        position: fixed;
        pointer-events: none;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        opacity: 0.1;
      }

      /* Glow effect for Seven's voice */
      .glow-seven {
        text-shadow: 0 0 5px rgba(34, 211, 238, 0.4);
      }
      
      /* Glow effect for Alerts */
      .glow-alert {
        text-shadow: 0 0 5px rgba(239, 68, 68, 0.6);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0b1121; 
      }
      ::-webkit-scrollbar-thumb {
        background: #155e75; 
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #22d3ee; 
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "framer-motion": "https://esm.sh/framer-motion@^11.0.0",
    "xterm": "https://esm.sh/xterm@^5.3.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div class="scanlines"></div>
  </body>
</html>
